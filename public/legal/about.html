<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معلومات الشركة — نظام إدارة المدرسة</title>
<link rel="stylesheet" href="/legal/legal.css">
</head>
<body>
<main id="content" tabindex="-1">
  <h1>معلومات الشركة</h1>
  <table>
    <tbody>
      <tr><th scope="row">الاسم القانوني</th><td data-biz="companyName"></td></tr>
      <tr><th scope="row">رقم التسجيل</th><td data-biz="registrationNo"></td></tr>
      <tr><th scope="row">الرقم الضريبي</th><td data-biz="taxNo"></td></tr>
      <tr><th scope="row">العنوان</th><td data-biz="address"></td></tr>
      <tr><th scope="row">البريد الإلكتروني</th><td data-biz="email"></td></tr>
      <tr><th scope="row">الهاتف</th><td data-biz="phone"></td></tr>
      <tr><th scope="row">مسؤول حماية البيانات</th><td><span data-biz="dpoName"></span> — <span data-biz="dpoEmail"></span></td></tr>
      <tr><th scope="row">موقع حفظ البيانات</th><td data-biz="hostingRegion"></td></tr>
    </tbody>
  </table>
</main>
<script src="/js/business.js"></script>
<script src="/legal/legal.js"></script>
</body>
</html>
